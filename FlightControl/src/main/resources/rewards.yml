# AVISO: Você DEVE configurar as categorias no categories.yml para
# que as recompensas funcionem corretamente.

# Esta é a recompensa para a categoria *global*
global:
  # Cada jogador na categoria global recebe este comando a cada
  # período de cooldown. Por padrão, jogadores globais não recebem nada a cada 1 dia.
  cooldown: "1 day"
  # Estes são os comandos que são executados após cada período de cooldown.
  commands:
    - ""
# Esta é a recompensa para a categoria VIP
vip:
  # Cada jogador na categoria VIP recebe este comando a cada
  # período de cooldown. Por padrão, jogadores VIP recebem 1 hora de tempfly a cada 12 horas.
  cooldown: "12 hours"
  # Estes são os comandos que são executados após cada período de cooldown.
  # /silenttempfly desabilita a saída do console para o comando /tempfly
  # para reduzir spam.
  commands:
    - "silenttempfly add 1h %player%"
mvp:
  cooldown: "2 hours"
  commands:
    - "silenttempfly add 1h %player%"