# A categoria "global" aplica-se a TODOS os jogadores sem permissão para outra categoria.
global:
  worlds:
    # Substitua pelos nomes reais dos mundos.
    enable: [NOME_DO_MUNDO, NOME_DO_MUNDO2]
    # USE A SEÇÃO "disable" APENAS PARA SOBRESCREVER ÁREAS/CONFIGURAÇÕES COM VOO HABILITADO
    disable: []
  # "regions" requer WorldEdit e WorldGuard.
  regions:
    enable:
      # Substitua pelos mundos e regiões reais.
      NOME_DO_MUNDO3: [NOME_DA_REGIAO, NOME_DA_REGIAO2]
      NOME_DO_MUNDO4: [NOME_DA_REGIAO3]
    # USE A SEÇÃO "disable" APENAS PARA SOBRESCREVER ÁREAS/CONFIGURAÇÕES COM VOO HABILITADO
    disable: []
  # Existem oito tipos de territórios de facção (OWN, ALLY, TRUCE, NEUTRAL, ENEMY, WARZONE, SAFEZONE, WILDERNESS).
  # OWN habilita o voo no território da própria facção do jogador.
  factions:
    enable: [OWN, ALLY]
    # USE A SEÇÃO "disable" APENAS PARA SOBRESCREVER ÁREAS/CONFIGURAÇÕES COM VOO HABILITADO
    disable: []
  # Desabilitar/habilitar voo em certos territórios de plugins
  # Suporta: GriefPrevention, Lands, PlotSquared, TownyTown, TownyNation,
  #          RedProtect, BentoBox (ilha), WorldGuard, Residence,
  #          SuperiorSkyblock2, GriefDefender, CrashClaim, ProtectionStones
  territory:
    enable:
      # Habilitar/Desabilitar no próprio território do jogador
      own: [Lands, Towny]
      # Habilitar/Desabilitar em território onde o jogador é membro
      trusted: [PlotSquared]
    # USE A SEÇÃO "disable" APENAS PARA SOBRESCREVER ÁREAS/CONFIGURAÇÕES COM VOO HABILITADO
    disable: []

