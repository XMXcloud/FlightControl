# Estas são categorias individuais
categories:
  # "vip" é uma categoria. Sua permissão é "flightcontrol.category.vip"
  # Você pode alterar os nomes das categorias, mas certifique-se de usar apenas LETRAS ou NÚMEROS.
  vip:
    # A categoria com maior prioridade é aplicada ao jogador.
    priority: 2
    worlds:
      enable: [NOME_DO_MUNDO, NOME_DO_MUNDO2]
    regions:
      enable:
        NOME_DO_MUNDO3: [NOME_DA_REGIAO, NOME_DA_REGIAO2]
        NOME_DO_MUNDO4: [NOME_DA_REGIAO3]
    factions:
      enable: [WILDERNESS]
    territory:
      enable:
        own: [Lands, Towny]
        trusted: [PlotSquared]
  # "mvp" é outra categoria. Sua permissão é "flightcontrol.category.mvp"
  mvp:
    priority: 1
    worlds:
      enable: [NOME_DO_MUNDO, NOME_DO_MUNDO2]
    regions:
      enable:
        NOME_DO_MUNDO3: [NOME_DA_REGIAO, NOME_DA_REGIAO2]
        NOME_DO_MUNDO4: [NOME_DA_REGIAO3]
    factions:
      enable: [WILDERNESS]
    territory:
      enable:
        own: [Lands, Towny]
        trusted: [PlotSquared]